name: Build and test unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: macos-26
    env:
      APP_VERSION: "1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Xcode and iOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "${SDK_MAJOR}" -lt 26 ]; then
            echo "iOS SDK 26 or later is required; found ${SDK_VERSION}"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate and generate content resources
        run: |
          node scripts/check-quotes.mjs
          node scripts/export-ios-content.mjs
          node scripts/export-ios-content-en.mjs
          node scripts/check-ios-closeout.mjs

      - name: Generate native Xcode project
        working-directory: native-ios
        run: xcodegen generate

      - name: Run iOS unit tests
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(device["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          if [ -z "${SIMULATOR_ID}" ]; then
            echo "No available iOS simulator found"
            exit 1
          fi
          xcodebuild \
            -project native-ios/InspiracionDia.xcodeproj \
            -scheme InspiracionDia \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project native-ios/InspiracionDia.xcodeproj \
            -scheme InspiracionDia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            MARKETING_VERSION=${APP_VERSION} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios -path '*Release-iphoneos/*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          BUNDLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP_PATH/Info.plist")"
          if [ "$DISPLAY_NAME" != "Warm Words" ] || [ "$BUNDLE_NAME" != "Warm Words" ]; then
            echo "Unexpected public app name: display=$DISPLAY_NAME bundle=$BUNDLE_NAME"
            exit 1
          fi
          LOCALIZATION_EN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations:0' "$APP_PATH/Info.plist")"
          LOCALIZATION_ES="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations:1' "$APP_PATH/Info.plist")"
          if [ "$LOCALIZATION_EN" != "en" ] || [ "$LOCALIZATION_ES" != "es" ]; then
            echo "Expected English and Spanish bundle localizations"
            exit 1
          fi
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")"
          if [ "$ICON_NAME" != "AppIcon" ]; then
            echo "Unexpected primary AppIcon name: $ICON_NAME"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "Compiled asset catalog Assets.car was not bundled"
            find "$APP_PATH" -maxdepth 2 -type f | sort
            exit 1
          fi
          for RESOURCE in content.json content-en.json PrivacyInfo.xcprivacy; do
            if [ ! -f "$APP_PATH/$RESOURCE" ]; then
              echo "$RESOURCE was not bundled"
              find "$APP_PATH" -maxdepth 2 -type f | sort
              exit 1
            fi
          done
          if [ ! -f "$APP_PATH/premium-mountains.png" ] || [ ! -f "$APP_PATH/premium-stones.png" ]; then
            echo "Premium image resources were not bundled"
            find "$APP_PATH" -maxdepth 2 -type f | sort
            exit 1
          fi
          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" "unsigned-ipa/Payload/$(basename "$APP_PATH")"
          VERSIONED_IPA="InspiracionDia-iPhone-v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}.ipa"
          (cd unsigned-ipa && zip -qry "../${VERSIONED_IPA}" Payload)
          cp "${VERSIONED_IPA}" InspiracionDia-unsigned.ipa
          ls -lh "${VERSIONED_IPA}" InspiracionDia-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: InspiracionDia-unsigned-ipa
          path: InspiracionDia-unsigned.ipa
          retention-days: 3
